<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusFeed" />
    
    <title>CampusFeed | Stop Guessing, Start Knowing</title>
    <meta name="description" content="The anonymous voting app for our school. Find out who likes you." />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="CampusFeed" />

    <!-- The Cache-Busting Favicon Link -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <!-- WhatsApp & Instagram Link Preview Tags -->
    <meta property="og:title" content="CampusFeed is live 🚀" />
    <meta property="og:description" content="Someone in your class just voted for you. Unlock your inbox to see who." />
    <meta property="og:image" content="https://placehold.co/1200x630/18181b/8b5cf6/png?text=CampusFeed%5CnStop+Guessing,+Start+Knowing" />
    <meta property="og:type" content="website" />

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
